workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: "com.example.ai_novel_mobile"
    scripts:
      - name: Get Flutter dependencies
        script: |
          cd app
          flutter pub get
      - name: Flutter build apk
        script: |
          cd app
          flutter build apk --release
    artifacts:
      - app/build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - user@example.com
        notify:
          success: true
          failure: false
      scripts:
        - POLL_FOR_BUILD_STATUS_TIMEOUT: 600
        - DART_PUB_DEV_RELEASE: false

